name: Build & Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Nim Environment
        run: |
          # Install Nim using choosenim (self-contained installer) to avoid relying on an external action
          curl -sSf https://nim-lang.org/choosenim/init.sh | sh -s -- -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH
          export PATH="$HOME/.nimble/bin:$PATH"
          nim --version

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rpm ruby ruby-dev rubygems build-essential
          sudo gem install --no-document fpm

      - name: Compile Nim Binaries
        run: |
          nim c -d:release play_140p.nim
          nim c -d:release audioconvert.nim
          nim c -d:release projects/lazy_vault/lazy_vault.nim

      - name: Build Standalone Tarballs & FPM Packages (DEB & RPM)
        run: |
          chmod +x build_packages.sh
          ./build_packages.sh
          cp dist/*.tar.gz .
          cp dist/individual/*.tar.gz .

          # 1. Full Suite DEB & RPM
          mkdir -p build_suite/usr/local/bin build_suite/usr/local/share/man/man1
          cp play_140p audioconvert projects/lazy_vault/lazy_vault build_suite/usr/local/bin/
          cp *.1 build_suite/usr/local/share/man/man1/ || true
          fpm -s dir -t deb -n lazy-tools -v 1.0.0 --description "Universal Nim CLI Suite (play_140p, audioconvert, lazy_vault)" -C build_suite .
          fpm -s dir -t rpm -n lazy-tools -v 1.0.0 --description "Universal Nim CLI Suite (play_140p, audioconvert, lazy_vault)" -C build_suite .

          # 2. Standalone play_140p DEB & RPM
          mkdir -p build_play140p/usr/local/bin
          cp play_140p build_play140p/usr/local/bin/
          fpm -s dir -t deb -n play-140p -v 1.0.0 --description "YouTube player TUI tuned for digital wellbeing" -C build_play140p .
          fpm -s dir -t rpm -n play_140p -v 1.0.0 --description "YouTube player TUI tuned for digital wellbeing" -C build_play140p .

          # 3. Standalone audioconvert DEB & RPM
          mkdir -p build_audioconvert/usr/local/bin
          cp audioconvert build_audioconvert/usr/local/bin/
          fpm -s dir -t deb -n audioconvert -v 1.0.0 --description "Parallel multi-core audio converter and speech transcriber" -C build_audioconvert .
          fpm -s dir -t rpm -n audioconvert -v 1.0.0 --description "Parallel multi-core audio converter and speech transcriber" -C build_audioconvert .

          # 4. Standalone lazy_vault DEB & RPM
          mkdir -p build_lazyvault/usr/local/bin
          cp projects/lazy_vault/lazy_vault build_lazyvault/usr/local/bin/
          fpm -s dir -t deb -n lazy-vault -v 1.0.0 --description "Encrypted password & file vault" -C build_lazyvault .
          fpm -s dir -t rpm -n lazy-vault -v 1.0.0 --description "Encrypted password & file vault" -C build_lazyvault .

      - name: Verify All Release Assets
        run: |
          ls -la *.deb *.rpm *.tar.gz

      - name: Create GitHub Release & Upload Packages
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            *.deb
            *.rpm
            *.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
